name: Pytest

on: [push, pull_request]

jobs:
  tests:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the project
      # Exclude the `ssm` extra: mamba-ssm has no pure-Python wheel and its
      # setup.py needs nvcc (absent on the CPU runner), so building it fails.
      # MambaIC / CMIC fall back to the pure-PyTorch selective-scan path, so
      # their tests still run without it.
      run: uv sync --reinstall --locked --all-extras --no-extra ssm --dev

    - name: Run unit tests
      run: uv run pytest -m "not slow" --cov=compressai -s tests/
